# .github/workflows/keep-colab-alive.yml
name: Keep Colab VM Alive

on:
  schedule:
    # Run every 50 minutes to stay ahead of the 90-minute idle timeout
    - cron: '*/50 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Colab CLI
        run: |
          pip install --upgrade pip
          pip install colab-cli
          # CRITICAL FIX: Add user bin to PATH so 'colab' command works
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          colab --version

      - name: Authenticate with Service Account
        run: |
          # Write the service account key to a temp file
          echo "${{ secrets.COLAB_SA_KEY }}" > /tmp/colab-sa-key.json
          # Login using the service account
          colab login --service-account /tmp/colab-sa-key.json

      - name: Ping Colab VM
        run: |
          NOTEBOOK_PATH="RDP_Linux.ipynb"
          
          echo "Pinging Colab VM..."
          
          # Run Cell 0 (Setup/Tailscale) to reset idle timer
          # Using 'colab' command now that PATH is fixed
          colab run "$NOTEBOOK_PATH" --cell=0 --timeout=60
          
          echo "✅ Colab VM pinged successfully."
