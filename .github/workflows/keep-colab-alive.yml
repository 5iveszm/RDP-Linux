# .github/workflows/keep-colab-alive.yml
name: Keep Colab VM Alive

on:
  schedule:
    # Run every 50 minutes
    - cron: '*/50 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Colab CLI
        run: |
          pip install --upgrade pip
          pip install colab-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          colab --version

      - name: Authenticate with Service Account
        run: |
          echo "${{ secrets.COLAB_SA_KEY }}" > /tmp/colab-sa-key.json
          colab login --service-account /tmp/colab-sa-key.json

      - name: Run Notebook to Keep Alive
        run: |
          NOTEBOOK_PATH="RDP_Linux.ipynb"
          
          # Run the entire notebook.
          # Cell 0: Install Tailscale (fast if already done)
          # Cell 1: Install RDP (fast if already done)
          # Cell 2: Start infinite loop
          # The --timeout ensures the action doesn't hang forever.
          # We run for 5 minutes to let the loop start, then kill it.
          # The Colab VM stays alive because the loop is running in the background
          # of the Colab runtime, not the GitHub Action.
          
          echo "Running notebook to keep VM alive..."
          
          # Run Cell 0 and 1 first (setup)
          colab run "$NOTEBOOK_PATH" --cell=0,1 --timeout=120
          
          # Start Cell 2 (infinite loop) in the background
          colab run "$NOTEBOOK_PATH" --cell=2 --timeout=300 &
          COLAB_PID=$!
          
          # Let it run for 5 minutes
          sleep 300
          
          # Kill the process
          kill $COLAB_PID 2>/dev/null || true
          
          echo "✅ Colab VM kept alive. Check Tailscale dashboard for IP."
