# .github/workflows/keep-colab-alive.yml
name: Keep Colab VM Alive

on:
  schedule:
    # Run every 55 minutes to stay ahead of the 90-minute idle timeout
    - cron: '*/55 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Colab CLI
        run: |
          pip install --upgrade pip
          pip install colab-cli
          # Ensure the 'colab' command is in the PATH
          pip install --force-reinstall colab-cli
          which colab || ln -s $(python -m site --user-base)/bin/colab /usr/local/bin/colab
          colab --version

      - name: Authenticate with Service Account
        run: |
          # Write the service account key to a temp file
          echo "${{ secrets.COLAB_SA_KEY }}" > /tmp/colab-sa-key.json
          # Login using the service account
          colab login --service-account /tmp/colab-sa-key.json

      - name: Ping Colab VM
        run: |
          # Define your notebook path (relative to your repo root)
          NOTEBOOK_PATH="RDP_Linux.ipynb"
          
          # Strategy: Run the first cell (usually setup/Tailscale) to trigger activity.
          # If your Tailscale setup is in Cell 0, run it.
          # If your infinite loop is in Cell 2, we just need to touch the VM.
          
          echo "Pinging Colab VM..."
          
          # Run the first cell to ensure the runtime is active
          # The '--timeout' ensures it doesn't hang if the cell is an infinite loop
          colab run "$NOTEBOOK_PATH" --cell=0 --timeout=60
          
          echo "✅ Colab VM pinged successfully."

      - name: Optional - Check Tailscale Status
        run: |
          # If you have a cell that outputs the Tailscale IP, you can capture it.
          # This is optional and depends on your notebook structure.
          echo "Check your Tailscale dashboard to confirm the VM is connected."
