# .github/workflows/keep-colab-alive.yml
name: Keep Colab VM Alive

on:
  schedule:
    # Run every 50 minutes to stay ahead of the 90-minute idle timeout
    - cron: '*/50 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Colab CLI
        run: |
          pip install --upgrade pip
          pip install colab-cli
          # Fix: Ensure 'colab' is in the PATH
          # pip usually installs to ~/.local/bin, which might not be in PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Verify it works
          colab --version || python -m colab --version

      - name: Authenticate with Service Account
        run: |
          echo "${{ secrets.COLAB_SA_KEY }}" > /tmp/colab-sa-key.json
          # Use python -m colab to be safe if 'colab' binary is still elusive
          python -m colab login --service-account /tmp/colab-sa-key.json

      - name: Ping Colab VM
        run: |
          NOTEBOOK_PATH="RDP_Linux.ipynb"
          
          # Run Cell 0 (Setup/Tailscale) to reset idle timer
          # Use python -m colab for maximum compatibility
          python -m colab run "$NOTEBOOK_PATH" --cell=0 --timeout=60
          
          echo "✅ Colab VM pinged successfully."
